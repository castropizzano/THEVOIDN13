name: Version Bump & Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes summary'
        required: false
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Configure Git
        run: |
          git config user.name "THEVØIDN13 Bot"
          git config user.email "bot@thevoidn13.dev"
          
      - name: Read current version
        id: current_version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
          
      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          IFS='.' read -r major minor patch <<< "$CURRENT"
          
          case "${{ github.event.inputs.version_type }}" in
            major)
              NEW_VERSION="$((major + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$major.$((minor + 1)).0"
              ;;
            patch)
              NEW_VERSION="$major.$minor.$((patch + 1))"
              ;;
          esac
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          
      - name: Update VERSION file
        run: |
          echo "${{ steps.new_version.outputs.new_version }}" > VERSION
          
      - name: Update CITATION.cff
        run: |
          sed -i "s/version: .*/version: ${{ steps.new_version.outputs.new_version }}/" CITATION.cff
          sed -i "s/date-released: .*/date-released: \"$(date +%Y-%m-%d)\"/" CITATION.cff
          
      - name: Update README badges
        run: |
          VERSION="${{ steps.new_version.outputs.new_version }}"
          sed -i "s/Version-[0-9.]*-/Version-$VERSION-/" README.md
          
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.new_version.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)
          NOTES="${{ github.event.inputs.release_notes }}"
          
          if [ -z "$NOTES" ]; then
            NOTES="Release version $VERSION"
          fi
          
          cat > release_notes_temp.md << EOF
          ## v$VERSION — $DATE
          
          $NOTES
          
          ### Changes
          \`\`\`
          $(git log --oneline --pretty=format:"- %s" v${{ steps.current_version.outputs.version }}..HEAD || echo "- Initial release")
          \`\`\`
          
          ### Commits
          \`\`\`
          Full changelog: v${{ steps.current_version.outputs.version }}...v$VERSION
          \`\`\`
          EOF
          
      - name: Prepend to RELEASE_NOTES.md
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            # Insert after header, before first release
            awk '/^───────────────────────────────────────────────────────────────$/ && !found {found=1; print; system("cat release_notes_temp.md"); print ""; print "───────────────────────────────────────────────────────────────"; print ""; next} 1' RELEASE_NOTES.md > RELEASE_NOTES_NEW.md
            mv RELEASE_NOTES_NEW.md RELEASE_NOTES.md
          else
            cat release_notes_temp.md > RELEASE_NOTES.md
          fi
          rm release_notes_temp.md
          
      - name: Commit changes
        run: |
          git add VERSION CITATION.cff README.md RELEASE_NOTES.md
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.new_version }}"
          
      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Release v${{ steps.new_version.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.new_version.outputs.new_version }}"
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.new_version.outputs.new_version }}
          release_name: THEVØIDN13 v${{ steps.new_version.outputs.new_version }}
          body_path: release_notes_temp.md
          draft: false
          prerelease: false
